# ============================================================
# Security — dependency audit and secret scanning
# Runs on every PR and weekly on Sundays
# ============================================================
name: Security — Audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 0"       # every Sunday at 06:00 UTC
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit safety

      - name: Run pip-audit (CVE scan)
        run: |
          pip-audit --requirement requirements.txt \
            --ignore-vuln PYSEC-2024-232 \
            --format=json \
            --output=audit-results.json || true
          echo "Audit complete — review audit-results.json"

      - name: Run Safety check
        run: safety check --file requirements.txt --output text || true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-results
          path: backend/audit-results.json
          retention-days: 30

  secret-scan:
    name: Secret detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0         # full history for secret scanning

      - name: Detect hardcoded secrets
        run: |
          echo "Scanning for hardcoded credentials..."
          FOUND=0

          # Patterns to flag
          PATTERNS=(
            "api_token\s*=\s*['\"][a-zA-Z0-9_-]{20,}"
            "password\s*=\s*['\"][^'\"]{8,}"
            "secret\s*=\s*['\"][^'\"]{8,}"
            "ghp_[a-zA-Z0-9]{36}"
            "AKIA[0-9A-Z]{16}"
          )

          for PATTERN in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rn -E "$PATTERN" \
              --include="*.py" --include="*.yml" --include="*.yaml" \
              --exclude-dir=".git" --exclude-dir="__pycache__" \
              --exclude="*.example" \
              . 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "⚠️  Potential secret found matching: $PATTERN"
              echo "$MATCHES"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 0 ]; then
            echo "✅ No hardcoded secrets detected"
          else
            echo "❌ Potential secrets found — review above"
            exit 1
          fi

  env-file-check:
    name: Verify .env is gitignored
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check .env is not committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "❌ CRITICAL: .env file is tracked by git — remove it immediately"
            echo "Run: git rm --cached .env && git commit -m 'Remove .env'"
            exit 1
          else
            echo "✅ .env is not tracked by git"
          fi

      - name: Check .gitignore has .env
        run: |
          if grep -q "^\.env$" .gitignore; then
            echo "✅ .env is in .gitignore"
          else
            echo "⚠️  .env is not explicitly listed in .gitignore"
          fi
