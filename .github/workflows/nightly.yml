# ============================================================
# Nightly — scheduled health check and KPI validation
# Runs every day at 05:00 UTC (after the app's 03:00 sync job)
# ============================================================
name: Nightly — Health Check

on:
  schedule:
    - cron: "0 5 * * *"       # every day at 05:00 UTC
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  health-check:
    name: Nightly KPI validation
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite+aiosqlite:///./nightly_test.db
      JIRA_BASE_URL: https://mock.atlassian.net
      JIRA_AUTH_TYPE: api_token
      JIRA_USERNAME: ci@test.com
      JIRA_API_TOKEN: mock_token
      APP_ENV: development
      SCHEDULER_ENABLED: "false"
      LOG_LEVEL: WARNING

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run full test suite
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Seed and validate KPI calculations
        run: |
          python -m tests.seed_mock_data
          python -c "
          import asyncio, sys
          from storage.database import get_db
          from storage.models import KPIResult, RiskScore, DimProject
          from sqlalchemy import select, func

          async def validate():
              async with get_db() as db:
                  kpi_count = (await db.execute(select(func.count(KPIResult.id)))).scalar()
                  risk_count = (await db.execute(select(func.count(RiskScore.id)))).scalar()
                  proj_count = (await db.execute(select(func.count(DimProject.id)))).scalar()

                  print(f'Projects:  {proj_count}')
                  print(f'KPI rows:  {kpi_count}')
                  print(f'Risk rows: {risk_count}')

                  if kpi_count < 100:
                      print('FAIL: KPI count too low')
                      sys.exit(1)
                  if risk_count < 3:
                      print('FAIL: Risk score count too low')
                      sys.exit(1)
                  print('All validation checks passed.')

          asyncio.run(validate())
          "

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-test-results
          path: backend/test-results.xml
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "Nightly health check FAILED"
          echo "Check the test results artifact for details"
          # Uncomment to send Slack/email notifications:
          # curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
          #   -H 'Content-type: application/json' \
          #   --data '{"text":"❌ Jira Intelligence nightly check failed. Check GitHub Actions."}'
